name: VidMax upstream release monitor

on:
  schedule:
    # Daily at 05:30 AM India Standard Time.
    - cron: '5 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vidmax-upstream-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Verify upstream release metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          gpg --version | sed -n '1p'
          test -f scripts/keys/yt-dlp-signing-public.asc
          test -f schemas/upstream-status.schema.json

      - name: Run monitor regression tests
        shell: bash
        run: node --test tests/upstream-monitor.test.mjs

      - name: Collect and verify upstream evidence
        shell: bash
        run: node scripts/monitor-upstream.mjs --output upstream-status.json

      - name: Validate public snapshot
        shell: bash
        run: node scripts/validate-upstream-status.mjs upstream-status.json

      - name: Publish the status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- upstream-status.json
          if git diff --cached --quiet; then
            echo '[INFO] Upstream status is unchanged; no commit is needed.'
          else
            git commit -m 'chore: refresh verified upstream engine status'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
