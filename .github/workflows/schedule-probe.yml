name: VidMax Schedule Probe

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}

jobs:
  probe:
    name: Verify scheduled event delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Report event and execution time
        shell: bash
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC time: $(date -u --iso-8601=seconds)"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Ref: $GITHUB_REF"
